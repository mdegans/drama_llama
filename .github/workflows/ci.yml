# CI for drama_llama (#51, #70).
#
# Everything here delegates to `scripts/test.py`, which the justfile and the
# git hooks also call. That is the whole design (#68): the tests that gate a
# commit locally are byte-for-byte the ones that gate a push, and neither can
# drift from the other by editing only one of them. If a job below needs a new
# flag, add it to the script — do not inline a cargo invocation here.
#
# RUNNERS: self-hosted, on Mike's box — 32 cores, 128 GiB, a 3090. Two
# payoffs (#70). Hosted Actions minutes are a budget he has exhausted before,
# and self-hosted ones are free; more importantly, no hosted runner can hold a
# 13 GB model, so on hosted infrastructure CI could only ever be a compile
# gate. The `model` job below is the thing that budget bought.
#
# WHAT RUNS WHERE, and why it is asymmetric:
#
#   fmt       linux    seconds
#   gate      both     every feature configuration compiles, test targets too,
#                      PLUS the doctests, which nextest cannot run at all
#   test      both     the unignored tier — no weights on the GPU
#   model     linux    the #[ignore]'d tier: real weights, real CUDA
#   coverage  linux    instrumented `-t all`, uploaded to Codecov. Push only.
#
# `model` is Linux-only on purpose. The macOS leg is a Parallels VM whose
# Metal support is unverified, and the moeflux configuration would want the
# expert shards mounted into it — tens of GB for a second copy of what the
# host already has. So generation testing is NVIDIA-only for now and macOS
# stays a compile-and-fast-tests gate. Metal generation is covered by the
# pre-commit hook on the machine we actually develop on.
#
# BUILD PARALLELISM is per-runner, not global: 16 of the Linux box's 32
# cores (it does other work), and 4 on the macOS VM, which is all it was
# given. `CARGO_BUILD_JOBS` is also what cargo forwards to build scripts as
# `NUM_JOBS`, which is what the `cmake` crate reads for llama.cpp's own
# build, so one knob covers both halves.
#
# Do NOT add `NEXTEST_TEST_THREADS` to cap *test* parallelism the same way:
# the environment variable overrides the `full` profile's `test-threads = 1`
# (`.config/nextest.toml`), which is the only thing keeping two 13 GB models
# off one 24 GB card. Cap builds, never tests.
#
# CHECKOUT IS LEFT ON ITS DEFAULT `clean: true`, which runs `git clean -ffdx`
# and so deletes `target/` every run. That is a real rebuild each time, and
# it is a deliberate choice: Mike measured both llama.cpp builds as quick on
# this hardware, and a persistent workspace has a nastier failure mode — a
# file deleted on a branch lingers, notably a removed `tests/*.rs` that cargo
# would happily keep compiling. Full rebuilds also mean the `.sampling.toml`
# sidecar is regenerated from GGUF metadata every run, which exercises that
# path for free. Revisit only if the measurement says otherwise; the fix then
# is a target dir OUTSIDE the workspace, not `clean: false` (with one runner
# all jobs share one workspace, so a single cleaning job wipes the others').
# There is no `Swatinem/rust-cache` for the same reason it would not help: a
# CUDA llama.cpp build does not fit in a 10 GB Actions cache.

name: CI

# A memory note or a README typo must not spend eight minutes of the one
# GPU on this box. `.githooks/pre-commit` already makes exactly this call
# locally ("Non-Rust commits (memory notes, docs, fixtures) skip both checks
# — nothing they touch can break a build"); this is the same rule at the
# other end of the chain, and it exists because it was violated within
# minutes of the model job first going green.
#
# Written as `paths` starting from `**` rather than as `paths-ignore`, and
# the leading `**` is load-bearing twice over:
#
#   1. The default must be to RUN. A new directory nobody thought about
#      should cost a CI run, not silently skip one.
#   2. Only `paths` honours the `!` negation character — `paths-ignore` does
#      not, and the two cannot both filter one event. Two markdown files are
#      compiled INTO the crate (see below), so the list has to be able to
#      take a file back out of an exclusion, which is a thing only this
#      form can express.
#
# Note this would need revisiting if these jobs ever become *required*
# checks — a skipped required check blocks a merge rather than passing it.
on:
  push:
    branches: [main, "v*"]
    paths: &source
      - "**"
      - "!.claude/**"
      - "!**.md"
      - "!LICENSE*"
      # ...except this one. `src/lib.rs` mounts it as the crate-level
      # docs with `include_str!`, so its ```rust blocks are doctests the
      # `gate` job compiles, and a typo in one turns the tree red.
      # Editing it is editing source. Order matters here — a positive
      # pattern after a negative one re-includes.
      #
      # TERMS_OF_USE.md is deliberately NOT here, though `src/lib.rs`
      # `include_str!`s it too as `drama_llama::TOS`. The difference is
      # what an edit can do: the README carries compiled code, that file
      # carries prose. Changing it alters one string constant, which
      # nothing validates and no test can fail on — so a wording change
      # should not cost a 36-minute run and a turn on the GPU.
      - "README.md"
  pull_request:
    paths: *source
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI failure should be readable without re-running with more verbosity.
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The whole tree, not just the diff — a formatter is only useful if the
      # tree is a fixed point of it. Same gate as .githooks/pre-commit.
      - run: cargo fmt --check

  gate:
    name: permutations (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Generous because every run builds llama.cpp from scratch (see CHECKOUT
    # above) — twice on Linux, with CUDA and without, in separate target dirs.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, linux]
            jobs: 16
          - name: macos
            runner: [self-hosted, macos]
            jobs: 4
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      # Belt and braces: caps cmake directly, whichever generator it picks.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      # No `--ci`: that flag drops the configurations a *hosted* runner cannot
      # build, and the whole point of this box is that it can. It has nvcc, so
      # the `llama-cpp` configuration — llama.cpp + CUDA, untestable anywhere
      # else — is now covered here rather than only on Mike's laptop.
      #
      # `--all-targets` is the point of this job: a configuration building as
      # a *library* is not the same claim as its test targets building. #68
      # was filed because moeflux-only compiled as a library while ~38 of its
      # test targets had never been built by anyone.
      - run: python3 scripts/test.py check
      # Doctests live HERE, not in a job of their own, because they are a
      # per-configuration claim and this is the job that already paid to
      # build every configuration. `cargo check --all-targets` does not
      # compile doctests, so the permutation gate was blind to them: three
      # doc examples named `llama-cpp`-gated types without saying so and
      # failed to compile in configurations that lack the feature — one of
      # them on `Backend::set_log_callback`, a backend-*agnostic* trait
      # method, which is the exact leak `trait-layer` exists to catch.
      # Nothing reported it because nothing ran doctests at all until #66.
      #
      # Same `-c all --ci` sweep on both legs, and the asymmetry is the
      # point: `moeflux` and `both` are macOS-only, so the macOS leg is
      # the only place a moeflux-only doc example is ever compiled.
      - run: python3 scripts/test.py doctest -c all --ci
      # Free by construction: checkout runs `git clean -ffdx` at the START
      # of every run, so this tree is deleted and rebuilt next time no
      # matter what — leaving it on disk between runs buys nothing and
      # costs ~9 GB for a Metal build, more for CUDA plus the separate
      # `target/cpu` dir, times every registered runner. Nothing else
      # bounds a runner account's disk use, and the box is shared.
      # `always()` so a failed job cleans up too; artifact upload, where
      # there is one, runs before this.
      - name: reclaim disk
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/target"

  test:
    name: unignored (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, linux]
            jobs: 16
          - name: macos
            runner: [self-hosted, macos]
            jobs: 4
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      # Capping builds left the *tests* uncapped: the grammar engine uses
      # rayon, whose global pool defaults to
      # `std::thread::available_parallelism()` — all 32 logical CPUs here
      # (rayon-core `get_num_threads`). Same per-runner number as the
      # build cap. Unlike NEXTEST_TEST_THREADS this is safe: it bounds CPU
      # inside one test process and has nothing to do with the GPU
      # serialization that keeps two models off one card.
      RAYON_NUM_THREADS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: link model weights
        uses: ./.github/actions/link-models
      # `llama-cpp-cpu`, not `llama-cpp`: identical feature set minus `cuda`,
      # in its own target dir. Running the fast tier here rather than under
      # CUDA is deliberate — four of these tests DO load `models/model.gguf`,
      # but with `n_gpu_layers = 0` (see `load_test_model_cpu`), so the tier
      # stays fully parallel and touches no VRAM. Under `--features cuda` they
      # would race the `model` job for the card. Everything CUDA-shaped is in
      # the `ignored` tier, which is `model`'s job.
      - run: python3 scripts/test.py run -c llama-cpp-cpu -t unignored
      # Named exactly, not the whole directory: `clean: false` means
      # `target/test-logs/` accumulates every mode this box has ever run,
      # and an artifact holding another job's stale log is worse than none.
      # (The log lives under `target/`, never the config's own target dir —
      # see `log_path` in scripts/test.py.)
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: target/test-logs/llama-cpp-cpu-unignored.log
          if-no-files-found: ignore
      # See the `gate` job: the tree is rebuilt from scratch next run
      # regardless, so holding it costs disk and saves nothing.
      - name: reclaim disk
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/target"

  model:
    name: model tests (linux, cuda)
    runs-on: [self-hosted, linux]
    # Don't spend the card on a tree that isn't even formatted. Deliberately
    # NOT `needs: [test]`: that job is a matrix, so depending on it would make
    # the GPU tier hostage to the macOS VM being up.
    needs: [fmt]
    # The scarce resource is one 3090, and unlike the workflow-level group
    # above this one is not keyed on the ref — a second PR must queue rather
    # than land on a busy card. `cancel-in-progress: false` because a
    # half-finished model tier tells you nothing. (This only covers jobs in
    # THIS repo; other repos' runners on the same box are a separate problem
    # and a machine-level lock, not an Actions concurrency group.)
    concurrency:
      group: gpu-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "16"
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
      # See the `test` job: rayon's default pool is every logical CPU.
      RAYON_NUM_THREADS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # Two jobs in one. Printed, because when a test dies of `unable to
      # allocate CUDA0 buffer` the first question is what else was
      # resident. And saved, because the driver moves under us on
      # unattended upgrades, and a logit-level golden diff is only
      # interpretable next to the driver that produced it. The regression
      # harness records llama.cpp's own view of the machine, but nothing
      # in-process can see the driver version — this is where it comes
      # from. Job logs age out; the artifact rides with the run.
      - name: gpu
        run: |
          mkdir -p target/test-logs
          nvidia-smi | tee target/test-logs/nvidia-smi.txt
      - name: link model weights
        uses: ./.github/actions/link-models
      # `-c llama-cpp` is the CUDA configuration on Linux, and `-t ignored`
      # is the tier that loads real weights — 119 tests, ~11 minutes on Mike's
      # Mac. Serialized to one at a time by the `full` nextest profile.
      #
      # This assumes the shared models directory holds ALL of them:
      # `model.gguf` + `model.mmproj.gguf`, the Gemma 4 pair, and gpt-oss.
      # The suites that need the latter two `panic!` rather than skip when
      # their file is absent, so a partial directory is not a soft failure —
      # exclude them by name instead, which is what `test.py -x` is for:
      #
      #   -x session_gemma4 -x session_gptoss -x media_e2e_gemma
      #
      # (`media_e2e_gemma` wants the same Gemma weights but lives in the lib
      # binary, hence a test name where the other two are binary names.)
      - run: python3 scripts/test.py run -c llama-cpp -t ignored
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-model
          path: target/test-logs/llama-cpp-ignored.log
          if-no-files-found: ignore
      # Kept on success too, unlike the test log. A few KB, and its whole
      # value is being there for the *earlier* green run you want to diff
      # a later red one against.
      - name: upload gpu environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-env
          path: target/test-logs/nvidia-smi.txt
          if-no-files-found: ignore
      # See the `gate` job. This is the big one — a CUDA build plus every
      # test binary, and the runner that holds it is the runner with the
      # GPU jobs queued behind it.
      - name: reclaim disk
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/target"

  # Coverage. Deliberately NOT on pull_request: it is a second full pass over
  # the one GPU on a box that also runs Agora, and a PR already gets the same
  # tests uninstrumented from `test` and `model`. Codecov's badge tracks the
  # branch anyway, so measuring on push is what the badge actually needs.
  #
  # `-t all`, not `-t ignored`: the fast tier alone reports every generation
  # path as dead code (engine.rs 0%, decoder.rs 0%, session/mod.rs 32%), which
  # is the opposite of true and would make the badge a lie. Most of this crate
  # is only reachable with a model loaded.
  coverage:
    name: coverage (linux, cuda)
    runs-on: [self-hosted, linux]
    needs: [fmt]
    if: github.event_name != 'pull_request'
    # Same card as `model`, same queue. See that job for why this is not
    # keyed on the ref and why it does not cancel in progress.
    concurrency:
      group: gpu-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "16"
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
      RAYON_NUM_THREADS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      # NIGHTLY, and only here. llvm-cov's doctest support is unstable, and
      # doctests have to be in the number: nextest cannot run them, so they
      # are otherwise outside both the test run and the report. Both passes
      # must share a toolchain — profraw from a stable-built binary does not
      # merge with profraw from a nightly-built one — so the flag switches
      # the whole run, which is why this is a job-level toolchain rather
      # than a `+nightly` on one command.
      #
      # `test` and `model` stay on stable, so nothing about correctness
      # confidence changes. It also means every push type-checks the crate
      # on nightly for free, which is a real second gate we would otherwise
      # not have.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-llvm-cov shells out to llvm-profdata / llvm-cov from this
          # component. Without it the run fails after the whole build.
          components: llvm-tools-preview
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: link model weights
        uses: ./.github/actions/link-models
      - run: >-
          python3 scripts/test.py coverage
          -c llama-cpp -t all --doctests --lcov --json
      # Before `reclaim disk`, which deletes the directory these live in.
      # `if: always()` on both: a red test run still produced coverage, and
      # the run you most want the numbers from is the one that broke
      # something. `scripts/test.py coverage` reports on partial data for
      # the same reason.
      - name: upload to codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          # An upload hiccup is not a test failure. The job's exit status
          # should mean "the tests passed", not "codecov.io was reachable".
          fail_ci_if_error: false
      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json
            target/test-logs/coverage-llama-cpp-all.log
          if-no-files-found: ignore
      - name: reclaim disk
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/target"
