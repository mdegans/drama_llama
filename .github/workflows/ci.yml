# CI for drama_llama (#51, #70).
#
# Everything here delegates to `scripts/test.py`, which the justfile and the
# git hooks also call. That is the whole design (#68): the tests that gate a
# commit locally are byte-for-byte the ones that gate a push, and neither can
# drift from the other by editing only one of them. If a job below needs a new
# flag, add it to the script — do not inline a cargo invocation here.
#
# RUNNERS: self-hosted, on Mike's box — 32 cores, 128 GiB, a 3090. Two
# payoffs (#70). Hosted Actions minutes are a budget he has exhausted before,
# and self-hosted ones are free; more importantly, no hosted runner can hold a
# 13 GB model, so on hosted infrastructure CI could only ever be a compile
# gate. The `model` job below is the thing that budget bought.
#
# WHAT RUNS WHERE, and why it is asymmetric:
#
#   fmt     linux    seconds
#   gate    both     every feature configuration compiles, test targets too
#   test    both     the unignored tier — no weights on the GPU
#   model   linux    the #[ignore]'d tier: real weights, real CUDA
#
# `model` is Linux-only on purpose. The macOS leg is a Parallels VM whose
# Metal support is unverified, and the moeflux configuration would want the
# expert shards mounted into it — tens of GB for a second copy of what the
# host already has. So generation testing is NVIDIA-only for now and macOS
# stays a compile-and-fast-tests gate. Metal generation is covered by the
# pre-commit hook on the machine we actually develop on.
#
# BUILD PARALLELISM is per-runner, not global: 16 of the Linux box's 32
# cores (it does other work), and 4 on the macOS VM, which is all it was
# given. `CARGO_BUILD_JOBS` is also what cargo forwards to build scripts as
# `NUM_JOBS`, which is what the `cmake` crate reads for llama.cpp's own
# build, so one knob covers both halves.
#
# Do NOT add `NEXTEST_TEST_THREADS` to cap *test* parallelism the same way:
# the environment variable overrides the `full` profile's `test-threads = 1`
# (`.config/nextest.toml`), which is the only thing keeping two 13 GB models
# off one 24 GB card. Cap builds, never tests.
#
# CHECKOUT IS LEFT ON ITS DEFAULT `clean: true`, which runs `git clean -ffdx`
# and so deletes `target/` every run. That is a real rebuild each time, and
# it is a deliberate choice: Mike measured both llama.cpp builds as quick on
# this hardware, and a persistent workspace has a nastier failure mode — a
# file deleted on a branch lingers, notably a removed `tests/*.rs` that cargo
# would happily keep compiling. Full rebuilds also mean the `.sampling.toml`
# sidecar is regenerated from GGUF metadata every run, which exercises that
# path for free. Revisit only if the measurement says otherwise; the fix then
# is a target dir OUTSIDE the workspace, not `clean: false` (with one runner
# all jobs share one workspace, so a single cleaning job wipes the others').
# There is no `Swatinem/rust-cache` for the same reason it would not help: a
# CUDA llama.cpp build does not fit in a 10 GB Actions cache.

name: CI

# A memory note or a README typo must not spend eight minutes of the one
# GPU on this box. `.githooks/pre-commit` already makes exactly this call
# locally ("Non-Rust commits (memory notes, docs, fixtures) skip both checks
# — nothing they touch can break a build"); this is the same rule at the
# other end of the chain, and it exists because it was violated within
# minutes of the model job first going green.
#
# `paths-ignore` and not `paths`: the default must be to run. A new
# directory nobody thought about should cost a CI run, not silently skip
# one. Note this would need revisiting if these jobs ever become *required*
# checks — a skipped required check blocks a merge rather than passing it.
on:
  push:
    branches: [main, "v*"]
    paths-ignore: &docs
      - ".claude/**"
      - "**.md"
      - "LICENSE*"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI failure should be readable without re-running with more verbosity.
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The whole tree, not just the diff — a formatter is only useful if the
      # tree is a fixed point of it. Same gate as .githooks/pre-commit.
      - run: cargo fmt --check

  gate:
    name: permutations (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Generous because every run builds llama.cpp from scratch (see CHECKOUT
    # above) — twice on Linux, with CUDA and without, in separate target dirs.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, linux]
            jobs: 16
          - name: macos
            runner: [self-hosted, macos]
            jobs: 4
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      # Belt and braces: caps cmake directly, whichever generator it picks.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      # No `--ci`: that flag drops the configurations a *hosted* runner cannot
      # build, and the whole point of this box is that it can. It has nvcc, so
      # the `llama-cpp` configuration — llama.cpp + CUDA, untestable anywhere
      # else — is now covered here rather than only on Mike's laptop.
      #
      # `--all-targets` is the point of this job: a configuration building as
      # a *library* is not the same claim as its test targets building. #68
      # was filed because moeflux-only compiled as a library while ~38 of its
      # test targets had never been built by anyone.
      - run: python3 scripts/test.py check

  test:
    name: unignored (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: [self-hosted, linux]
            jobs: 16
          - name: macos
            runner: [self-hosted, macos]
            jobs: 4
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: link model weights
        uses: ./.github/actions/link-models
      # `llama-cpp-cpu`, not `llama-cpp`: identical feature set minus `cuda`,
      # in its own target dir. Running the fast tier here rather than under
      # CUDA is deliberate — four of these tests DO load `models/model.gguf`,
      # but with `n_gpu_layers = 0` (see `load_test_model_cpu`), so the tier
      # stays fully parallel and touches no VRAM. Under `--features cuda` they
      # would race the `model` job for the card. Everything CUDA-shaped is in
      # the `ignored` tier, which is `model`'s job.
      - run: python3 scripts/test.py run -c llama-cpp-cpu -t unignored
      # Named exactly, not the whole directory: `clean: false` means
      # `target/test-logs/` accumulates every mode this box has ever run,
      # and an artifact holding another job's stale log is worse than none.
      # (The log lives under `target/`, never the config's own target dir —
      # see `log_path` in scripts/test.py.)
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: target/test-logs/llama-cpp-cpu-unignored.log
          if-no-files-found: ignore

  model:
    name: model tests (linux, cuda)
    runs-on: [self-hosted, linux]
    # Don't spend the card on a tree that isn't even formatted. Deliberately
    # NOT `needs: [test]`: that job is a matrix, so depending on it would make
    # the GPU tier hostage to the macOS VM being up.
    needs: [fmt]
    # The scarce resource is one 3090, and unlike the workflow-level group
    # above this one is not keyed on the ref — a second PR must queue rather
    # than land on a busy card. `cancel-in-progress: false` because a
    # half-finished model tier tells you nothing. (This only covers jobs in
    # THIS repo; other repos' runners on the same box are a separate problem
    # and a machine-level lock, not an Actions concurrency group.)
    concurrency:
      group: gpu-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "16"
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-path
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # Printed, not asserted: when a test dies of `unable to allocate CUDA0
      # buffer`, the first question is what else was resident.
      - name: gpu
        run: nvidia-smi
      - name: link model weights
        uses: ./.github/actions/link-models
      # `-c llama-cpp` is the CUDA configuration on Linux, and `-t ignored`
      # is the tier that loads real weights — 119 tests, ~11 minutes on Mike's
      # Mac. Serialized to one at a time by the `full` nextest profile.
      #
      # This assumes the shared models directory holds ALL of them:
      # `model.gguf` + `model.mmproj.gguf`, the Gemma 4 pair, and gpt-oss.
      # The suites that need the latter two `panic!` rather than skip when
      # their file is absent, so a partial directory is not a soft failure —
      # exclude them by name instead, which is what `test.py -x` is for:
      #
      #   -x session_gemma4 -x session_gptoss -x media_e2e_gemma
      #
      # (`media_e2e_gemma` wants the same Gemma weights but lives in the lib
      # binary, hence a test name where the other two are binary names.)
      - run: python3 scripts/test.py run -c llama-cpp -t ignored
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-model
          path: target/test-logs/llama-cpp-ignored.log
          if-no-files-found: ignore
