# nextest configuration for drama_llama.
#
# GPU serialization
# -----------------
# Model-loading tests each pull a 30B-class GGUF/MLX model onto the GPU; only
# one fits on a 24GB card, so they MUST run one-at-a-time — otherwise
# `cudaMalloc failed: out of memory` on CUDA / thrash-or-crash on Metal (see
# .claude/memory/gpu-session-ops.md).
#
# These tests are all #[ignore]'d, but they live in BOTH integration binaries
# (tests/ → kind(test)) AND unit modules (src/ → kind(lib), ~46 of them),
# interleaved with fast pure-Rust unit tests. There is no filterset predicate
# for "loads a model", so a kind()-scoped test-group cannot catch them all — an
# earlier kind(test)-only `gpu` group missed every ignored src/ unit test and
# still OOM'd.
#
# So instead of trying to select the GPU tests, every tier that can reach a
# model test runs under this profile and we cap the whole profile at a single
# test at a time. No filter to get wrong. `just test ignored` runs ONLY the
# ignored tests (`--run-ignored only`); `just test all` runs those plus the
# fast ones (`--run-ignored all`) and pays the serialization for both, which is
# the price of a mode that is honestly everything. The default profile
# (`just test`, `just test cpu`) runs no model tests and stays fully parallel.
#
# Tiers are defined in `scripts/test.py`, which the justfile and CI both call.

[profile.full]
test-threads = 1
