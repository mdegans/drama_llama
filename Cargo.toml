[package]
name = "drama_llama"
version = "0.8.3"
edition = "2021"
# The stable toolchain CI actually tests (nothing older is ever built
# here, so a lower claim would be untested). Bump freely alongside CI's
# toolchain; this exists so an older-toolchain user gets a clear cargo
# error instead of a mystery build failure.
rust-version = "1.97"
description = "Local LLM inference behind an Anthropic-shaped API: llama.cpp and Metal-MoE backends, chat sessions with prefix caching, per-model tool-call dialects, and GBNF-constrained structured output."
license-file = "LICENSE.md"
repository = "https://github.com/mdegans/drama_llama"
keywords = ["llm", "llama", "inference", "text-generation", "gguf"]
categories = ["text-processing", "api-bindings", "science"]
# Keep session memory, agent instructions, and (especially) the
# detect-infringement corpus out of the published crate. The corpus
# contains copyrighted text used locally for testing; it must not be
# redistributed via crates.io. Nothing in src/ references it.
exclude = [
    ".claude/",
    "CLAUDE.md",
    "tests/data/",
    "**/.DS_Store",
    "**/__pycache__/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# BEFORE RAISING THIS VERSION: `src/llama_cpp/model.rs` carries
# `unsafe impl Sync for ModelInner`, and its soundness is a claim about
# llama.cpp, not about our code — that a loaded model is immutable.
# `llama_context` holds it as `const llama_model &`, there are no
# `mutable` members in llama-model.h / llama-vocab.h, and the one
# upstream call that writes a model through a context (`llama_opt_init`,
# finetune) is deliberately never bound into our safe surface.
#
# An upstream change to any of those breaks the impl **silently** — it
# is a `unsafe impl`, so nothing in this crate will fail to compile and
# no test will go red. Re-read the SAFETY comment at that impl when you
# bump, and see the resolution note in
# `.claude/memory/llama_cpp_ffi_audit.md` (#54) for what was verified
# and where.
#
# A CI tripwire for this lives upstream, where the submodule bump
# actually happens: mdegans/llama-cpp-sys#6. Until that lands, this
# comment is the only thing standing between a routine version bump and
# an unsound `Sync`.
llama-cpp-sys-3 = { version = "0.8.1", optional = true }

# moeflux (Metal-backed streaming-MoE decoder). macOS-only; drama_llama's
# own `moeflux` feature wraps the platform gate so cross-platform builds
# still work via `--no-default-features`. Pinned to an exact pre-release
# version since the API is unstable until 0.1.0 final.
moeflux = { version = "=0.1.0-pre.4", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = [
    "onig",
] }

derive_more = { version = "1", features = ["from"] }
num = "0.4"
uuid = { version = "1", features = ["v4"] }
partial_sort = { version = "0.2.0" }
rand = { version = "0.10" }
regex = "1.10"
static_assertions = "1.1.0"
thiserror = "1.0"
tinyvec = { version = "1.6", features = ["alloc"] }
rand_pcg = { version = "0.10.2", default-features = false }
rayon = "1.10.0"
dashmap = "6"
rustc-hash = "2"
sha2 = "0.10"
# `preserve_order` on minijinja + serde_json (below) keeps JSON maps
# in insertion order end-to-end (schemars declaration order →
# template render → grammar → parse → re-render). Enabled
# unconditionally: half-on would reintroduce the feature-unification
# hazard where a downstream crate flips serde_json's Map under us
# (#60). The dict/Gemma family is pinned alphabetical separately —
# its templates `dictsort`.
minijinja = { version = "2.5", features = [
    "loader",
    "json",
    "preserve_order",
] }
minijinja-contrib = { version = "2.5", features = ["pycompat"] }
misanthropic = { version = "1.0.0-alpha.12", default-features = false, features = [
    "partial-eq",
] }

axum = { version = "0.8", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
futures-util = { version = "0.3", optional = true }
# Non-optional: this crate's own diagnostics (sidecar read/write
# failures, mostly) have to go *somewhere*, and gating each call site on
# a feature is more moving parts than the dependency is worth. The `log`
# feature emits `log` records when no `tracing` subscriber is installed,
# so consumers using `env_logger` — the examples, among others — see our
# events without any bridging setup of their own.
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", optional = true }
markdown = { version = "=1.0.0-alpha.16", optional = true }
rocket = { version = "0.5", optional = true, features = ["json"] }
clap = { version = "4.5", optional = true, features = ["derive"] }
stringmetrics = { version = "2.2.2", optional = true }
toml = { version = "0.8", optional = true }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
dirs = { version = "5.0.1", optional = true }
egui = { version = "0.34", optional = true }
eframe = { version = "0.34", optional = true }
egui_file = { version = "0.26", optional = true }
egui_extras = { version = "0.34", optional = true, features = ["all_loaders"] }
image = { version = "0.25", optional = true, features = ["png"] }
rustyline = { version = "14", optional = true }
schemars = { version = "1", optional = true }
# Source of truth for the Agora `Soul` type the `soul_forge` example
# generates — a mirror struct would drift. `seed` carries the reactor
# seed-runner types (Soul lives there); the crate's misanthropic req
# (^1.0.0-alpha.7) unifies with ours. Example-only: nothing in src/
# references it, and the implicit `agora-agentkit` feature gates the
# example target.
agora-agentkit = { version = "0.7", optional = true, features = ["seed"] }


[features]
default = ["llama-cpp"]
# `llama-cpp` gates the llama.cpp-backed decoder + model implementations
# and forwards to the (optional) `llama-cpp-sys-3` crate. With
# `--no-default-features` the crate compiles down to the backend-agnostic
# trait layer (Token, TokenData, Decoder, Model, Engine<D, M>,
# Candidates' model-agnostic half, sampling options) with no C dep.
llama-cpp = ["dep:llama-cpp-sys-3"]
# Features below that need concrete llama.cpp types or the Session
# wrapper transitively imply `llama-cpp`.
webchat = [
    "dep:rocket",
    "toml",
    "dep:dirs",
    "dep:markdown",
    "serde",
    "llama-cpp",
]
# `toml` enables per-model sampling sidecar I/O via the `sidecar`
# module. Pulls in `serde` because the sidecar round-trips
# `SampleOptions` through serde-derived impls.
toml = ["dep:toml", "serde"]
# `cli` is clap plus the backend-agnostic CLI types in `src/cli.rs`
# (`BackendKind`, `BackendArgs`) — both cfg-gated per backend, so this
# does NOT imply a backend. It used to imply `llama-cpp`, which made a
# moeflux-only front-end impossible to build even though the library
# supported it (#68). A build with `cli` and no backend feature is a
# hard error with a message; see `src/cli.rs`.
cli = ["dep:clap"]
serde = ["tinyvec/serde", "rand_pcg/serde"]
stats = ["dep:stringmetrics"]
cuda = ["llama-cpp", "llama-cpp-sys-3/cuda"]
cuda_f16 = ["llama-cpp", "llama-cpp-sys-3/cuda_f16"]
# `media` gates the backend-agnostic image layer: `Block::Image` decode
# via the `image` crate (never mtmd's bundled stb_image — CVE posture)
# and the conversions into the frozen `Image` pixel record consumed by
# the `Vision` trait. No C dependency — compiles without `llama-cpp`,
# so moeflux-only builds can enable it (and get typed "media
# unsupported" errors from `NoVision` instead of silent drops).
media = [
    "dep:image",
    "image/jpeg",
    "misanthropic/image",
    "misanthropic/jpeg",
    "misanthropic/png",
]
# `mtmd` gates the llama.cpp multimodal backend: libmtmd bindings from
# llama-cpp-sys-3 plus the safe `Mtmd` wrapper (`src/llama_cpp/mtmd.rs`)
# implementing `Vision<LlamaCppDecoder>`.
mtmd = ["media", "llama-cpp", "llama-cpp-sys-3/mtmd"]
egui = [
    "dep:egui",
    "dep:eframe",
    "dep:egui_file",
    "dep:egui_extras",
    "dep:image",
]
repl = ["dep:rustyline", "cli"]
tokio = ["tokio/full", "dep:async-trait"]
axum = [
    "dep:axum",
    "dep:tokio-stream",
    "dep:futures-util",
    "tokio",
    "tracing/async-await",
    "tracing-subscriber/json",
    "tracing-subscriber/env-filter",
]
# Enable typed structured-output helpers: `Prompt::structured_output::<T>()`,
# `OutputConfig::for_type::<T>()`. Requires `schemars` for schema derivation.
# (misanthropic ≥1.0.0-alpha.2 ships schema support unconditionally, so
# on the misanthropic side this only enables the #[tool]/ToolArgs
# derive macros; dep:schemars gates our own schemars-derived helpers.)
json-schema = ["dep:schemars", "misanthropic/derive"]

# `moeflux` gates the moeflux-backed Decoder + Model implementations.
# Pulls in the safe `moeflux` wrapper (pure-Rust port + Metal kernels)
# and the HuggingFace `tokenizers` crate for Rust-side tokenization.
# Exactly one of `moeflux-model-*` must be enabled alongside — moeflux
# is compile-time variant-selected.
moeflux = ["dep:moeflux", "dep:tokenizers"]
moeflux-model-qwen3-5-a17b = ["moeflux", "moeflux/model-qwen3-5-a17b"]
moeflux-model-qwen3-6-35b-a3b = ["moeflux", "moeflux/model-qwen3-6-35b-a3b"]
# Cogito-V2-Preview-671B (DeepSeek-V3 architecture). MLA attention,
# noaux_tc routing, YaRN RoPE, dense first-3 layers. ~336 GB on disk
# at 4-bit; runs SSD-streamed on 96 GB MacBook hardware via moeflux's
# expert-paging machinery.
moeflux-model-cogito-v2-671b = ["moeflux", "moeflux/model-cogito-v2-671b"]

# Optimize test builds at the release level (3). The model-backed
# suite runs the sampler per token — at the default opt-level 0,
# whodunit_verdict measured 395s vs 92s optimized (#33). Unlike
# --cargo-profile release this keeps debug_assertions and overflow
# checks, which the sampler tests rely on. Compile time cost is small
# next to model runtime.
[profile.test]
opt-level = 3

[dev-dependencies]
# Oracle for the in-tree fuzzer (`examples/grammar_fuzz.rs`): validates
# `serde_json::Value`s against a JSON Schema so we can detect Class 3
# bugs (grammar rejects, schema accepts). Dev-only — never linked into
# library or binary builds.
jsonschema = { version = "0.30", default-features = false }
# Minimal executor for examples that drive misanthropic's async `Tool`
# trait (`#[tool]` macro dispatch) against the synchronous Session.
tokio = { version = "1", features = ["rt", "macros"] }
# Logging for the ported examples' `utils::log_init`.
env_logger = "0.11"
log = "0.4"
# The `python` example executes model-written scripts (after user
# confirmation) via a subprocess with a timeout, staged in a tempfile.
subprocess = "0.2"
tempfile = "3"
# `tests/blallama.rs` stops the spawned server with SIGTERM rather than
# `Child::kill()`'s SIGKILL, so the binary drains and — the reason it
# matters here — runs the `atexit` handler that writes its coverage
# `.profraw`. std has no portable signal sender. Already in the graph via
# tokio/rand; this only names it.
libc = "0.2"
# `tests/blallama.rs` drives the blallama binary over HTTP with the
# real API client. The library dependency above disables default
# features (no HTTP); tests re-enable the client half.
misanthropic = { version = "1.0.0-alpha.12", default-features = false, features = [
    "partial-eq",
    "client",
    "rustls-tls",
    "chat",
    "markdown",
    "derive",
    "bash",
    "bash-container",
] }

# `doc-scrape-examples = true` opts each example into rustdoc's
# example-scraping pass (see `cargo-args` under
# `[package.metadata.docs.rs]` below) so docs.rs shows real call sites
# next to the items they exercise. Note: once any example opts in,
# unflagged ones are excluded — keep the flag on every example whose
# required features are in the docs.rs feature list.
[[example]]
name = "neologism"
required-features = ["tokio", "cli"]
doc-scrape-examples = true

[[example]]
name = "few_shot_triage"
required-features = ["tokio", "cli", "json-schema"]
doc-scrape-examples = true

[[example]]
name = "structured_commit_classifier"
required-features = ["tokio", "cli", "json-schema"]
doc-scrape-examples = true

[[example]]
name = "soul_forge"
required-features = ["tokio", "cli", "json-schema", "agora-agentkit"]
doc-scrape-examples = true

[[example]]
name = "vote_intent"
required-features = ["tokio", "cli", "json-schema"]
doc-scrape-examples = true

[[example]]
name = "mid_conversation_system"
required-features = ["tokio", "cli"]
doc-scrape-examples = true

[[example]]
name = "prompt_caching"
required-features = ["tokio", "cli"]
doc-scrape-examples = true

[[example]]
name = "python"
required-features = ["tokio", "cli"]
doc-scrape-examples = true

[[example]]
name = "swarm"
required-features = ["tokio", "repl", "json-schema"]
doc-scrape-examples = true

[[example]]
name = "council"
required-features = ["tokio", "repl"]
doc-scrape-examples = true

# Sync example (no async `main`): drives the erased transport through
# `utils::BlockingTransport`, so it needs `tokio` for `SessionTransport`
# and `cli` for `CommonArgs`.
[[example]]
name = "unhelpful"
required-features = ["tokio", "cli"]
doc-scrape-examples = true

[[example]]
name = "strawberry"
required-features = ["tokio", "cli", "json-schema"]
doc-scrape-examples = true

# Differential fuzzer over the schema → grammar → JSON pipeline.
# Pure mode runs CPU-only; model mode also needs llama-cpp. `cli` pulls
# both clap and llama-cpp via the existing `cli` feature definition.
[[example]]
name = "grammar_fuzz"
required-features = ["cli"]
doc-scrape-examples = true

# The worked example for the raw prediction API: `Engine` +
# `CandidatePredictor` / `PiecePredictor`, no `Session`. Everything else
# in here drives the crate through `Session`/`Transport`, so this is the
# only place a reader sees the iterator layer those are built on. Names
# `LlamaCpp*` types directly (see the module doc comment) rather than
# going through the backend-generic API, so it needs `llama-cpp` itself
# now that `cli` no longer implies it (#68).
[[example]]
name = "whoami"
required-features = ["cli", "llama-cpp"]
doc-scrape-examples = true

[[example]]
name = "chat"
required-features = ["tokio", "repl"]
doc-scrape-examples = true

[[example]]
name = "whodunit"
required-features = ["json-schema", "llama-cpp"]
doc-scrape-examples = true

# Deliberately backend-concrete (see the module doc comment): drives
# `LlamaCppModel` directly rather than through the `Transport` erasure,
# so it needs `llama-cpp` itself now that nothing else pulls it in for
# free (#68).
[[example]]
name = "inspect_prompt"
required-features = ["llama-cpp"]
doc-scrape-examples = true

# Deliberately backend-concrete (see the module doc comment): reads
# GGUF metadata through `LlamaCppModel` directly, below the `Transport`
# erasure the other examples use.
[[example]]
name = "dump_template"
required-features = ["llama-cpp"]
doc-scrape-examples = true

# Spawns the blallama binary via `env!("CARGO_BIN_EXE_blallama")`, so
# it needs the bin's exact feature set; cargo builds the bin for the
# test only when these are active.
[[test]]
name = "blallama"
required-features = ["axum", "cli", "toml"]

# Every test in these four files loads a real llama.cpp model via
# `LlamaCppSession`/`LlamaCppEngine`/`FromPath` — wholly llama.cpp-only
# (#68), so the whole target is gated rather than per-test.
[[test]]
name = "session"
required-features = ["llama-cpp"]

[[test]]
name = "session_gemma4"
required-features = ["llama-cpp"]

[[test]]
name = "session_gptoss"
required-features = ["llama-cpp"]

[[test]]
name = "session_mistral4"
required-features = ["llama-cpp"]

[[test]]
name = "session_cogito"
required-features = ["llama-cpp"]

# `#![cfg(feature = "json-schema")]` inside the file already empties it
# out without that feature; `llama-cpp` is required too, for
# `Session::from_path_with_n_ctx` (the `Session<LlamaCppBackend>`
# inherent impl gated in `src/session/mod.rs`).
[[test]]
name = "output_config"
required-features = ["json-schema", "llama-cpp"]

[[bin]]
name = "regurgitater"
path = "bin/regurgitater/regurgitater.rs"
required-features = ["webchat", "cli", "stats"]

[[bin]]
name = "settings_tool"
path = "bin/settings_tool/settings_tool.rs"
required-features = ["egui", "serde"]

[[bin]]
name = "blallama"
path = "bin/blallama/blallama.rs"
required-features = ["axum", "cli", "toml"]

# Coherence-test worker for the moeflux engine — spawned by
# `tests/moeflux_coherence.rs` once per `(prompt_id, MOEFLUX_MOE_GATHER_ID)`
# pair. Greedy-decodes 30 steps and emits per-step top-50 logits on
# stdout as JSONL. Bin (not example) so the orchestrator test can
# discover it via `env!("CARGO_BIN_EXE_moeflux_coherence_decode")`.
[[bin]]
name = "moeflux_coherence_decode"
path = "bin/moeflux_coherence_decode.rs"
required-features = ["moeflux-model-qwen3-6-35b-a3b"]

[package.metadata.docs.rs]
# `cuda` will break the build on platforms without it, and it doesn't change the
# docs anyway. `tokio` and `repl` are included so the chat-loop examples
# (chat, council, swarm, …) participate in example scraping.
features = [
    "webchat",
    "cli",
    "stats",
    "toml",
    "serde",
    "egui",
    "json-schema",
    "repl",
    "tokio",
    # `mtmd` implies `media`; extends the docs.rs C build with libmtmd.
    # If docs.rs ever times out on it, drop to "media" (pure Rust) and
    # lose only the `Mtmd` page.
    "mtmd",
]
# Scrape the examples above into the rendered docs (nightly-only
# rustdoc feature; docs.rs builds on nightly).
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

# No [patch.crates-io]. There was one (#48) pointing misanthropic at a
# sibling working copy, waiting on misanthropic#140's `impl Transport for
# Arc<T>` — which `examples/utils::CommonArgs` needs to hand `Chat` an
# erased transport. That shipped in 1.0.0-alpha.12, the version pinned
# above, so the patch is gone.
#
# Think hard before adding another one: a path patch resolves to a
# directory that exists on exactly one machine, so CI dies at manifest
# resolution before it reaches any feature set or target (#51). If a
# sibling checkout is genuinely needed mid-development, keep it in
# `.cargo/config.toml` (gitignored) rather than here.
