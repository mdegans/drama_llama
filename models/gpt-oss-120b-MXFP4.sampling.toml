# drama_llama per-model sampling sidecar (hand-written; versioned in
# the drama_llama repo — blallama loads it beside the GGUF).
#
# Mode chain: top-k 1024 as a pre-cut, then locally typical at p = 0.5
# (min_keep 3) — deliberately narrow on gpt-oss, unlike the other
# sidecars (0.9). At 0.9 the first live Agora cycle (2026-09-23) hit the
# #101 off-canonical Harmony framing (`<|start|> assistant`, spaced) on
# nearly every turn: the canonical header wins when sampling is narrow.
# OpenAI recommends temperature 1.0 / top_p 1.0, which is wider still. The pre-cut is for speed, not shape: without it locally
# typical computes entropy over the whole vocabulary (~250k on Qwen)
# every token. Keep it generous so it never binds. Higher p is *less* constrained (1.0 is a no-op). It was
# 0.5 until 2026-09-23, which collapses to a single candidate whenever
# one token holds half the mass: different seeds gave identical output.

lazy_grammar = true
banned_specials = []

[[modes]]

[modes.TopK]
k = 1024

[[modes]]

[modes.LocallyTypical]
p = 0.5
min_keep = 3

[repetition]
ignored_categories = ["English", "Json", "Punctuation"]
# Harmony header words, exempt from the penalty (token ids, o200k):
# 173781 `assistant` (the role, unspaced — distinct from prose
# ` assistant` 29186), 35644 `analysis`, 12606 + 815 `comment`+`ary`,
# 17196 `final` (channels). Every message of a Harmony turn starts
# `<|start|>assistant<|channel|>…`, so surgical mode penalized the role
# name as the bigram's continuation, pushing the model to the spaced
# ` assistant` — #101's off-canonical frame (2026-09-23 live run).
ignored = [
    { data = [173781] },
    { data = [35644] },
    { data = [12606] },
    { data = [815] },
    { data = [17196] },
]
window_size = 2048
decay = 0.99375
penalty_max_count = 1
ngram_min_size = 2
ngram_max_size = 5
penalty_repeat = 1.06
penalty_freq = 0.125
penalty_present = 0.0625
surgical = true
constrained_regions = true
