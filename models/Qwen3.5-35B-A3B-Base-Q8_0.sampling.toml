# drama_llama per-model sampling sidecar (hand-written; versioned in
# the drama_llama repo — blallama loads it beside the GGUF).
#
# Mode chain: top-k 1024 as a pre-cut, then locally typical at p = 0.5
# (min_keep 3). p = 0.5 is narrow: it collapses to a single candidate
# whenever one token holds half the probability mass, so different
# seeds often give identical output (observed on Qwen3.8, 2026-09-23).
# Base model (soul_forge). An earlier note here recommended p = 0.9 for
# run-to-run variety, with `soul_forge --shuffle` and `--names`; the
# value below is 0.5.

lazy_grammar = true
banned_specials = []

[[modes]]

[modes.TopK]
k = 1024

[[modes]]

[modes.LocallyTypical]
p = 0.5
min_keep = 3

[repetition]
ignored_categories = ["English", "Json", "Punctuation"]
ignored = []
window_size = 2048
decay = 0.99375
penalty_max_count = 1
ngram_min_size = 2
ngram_max_size = 5
penalty_repeat = 1.06
penalty_freq = 0.125
penalty_present = 0.0625
surgical = true
constrained_regions = true
