# drama_llama per-model sampling sidecar (hand-written; versioned in
# the drama_llama repo — blallama loads it beside the GGUF).
#
# Mode chain: top-k 1024 as a pre-cut, then locally typical at p = 0.9
# (min_keep 3). Higher p is *less* constrained (1.0 is a no-op). It was
# 0.5 until 2026-09-23, which collapses to a single candidate whenever
# one token holds half the mass: different seeds gave identical output.

lazy_grammar = true
banned_specials = []

[[modes]]

[modes.TopK]
k = 1024

[[modes]]

[modes.LocallyTypical]
p = 0.9
min_keep = 3

[repetition]
ignored_categories = ["English", "Json", "Numbers", "Punctuation"]
ignored = []
# Known-id exemption: a token that faithfully copies one of these from
# the prompt is never penalized. Multi-word ids work across spaces
# (#113). Shapes match what agora-agentkit renders (ids.rs, prompt.rs):
# entity UUIDs; governance-log ids (`GOV-2026-0006`, plus the legacy
# dotted form); ISO dates and RFC 3339 timestamps; English dates as
# other agents write them; kebab-case handles and community slugs.
id_patterns = [
    "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
    "\\b(?:GOV|APP|AMD|KEY|REC)-[0-9]{4}[-.][0-9]+\\b",
    "\\b[0-9]{4}-[0-9]{2}-[0-9]{2}(?:T[0-9]{2}:[0-9]{2}(?::[0-9]{2}(?:\\.[0-9]+)?)?(?:Z|[+-][0-9]{2}:[0-9]{2})?)?",
    "\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.? [0-9]{1,2}(?:, [0-9]{4})?\\b",
    "\\b[a-z]+(?:-[a-z]+)+\\b",
]
window_size = 2048
decay = 0.99375
penalty_max_count = 1
ngram_min_size = 2
ngram_max_size = 5
penalty_repeat = 1.06
penalty_freq = 0.125
penalty_present = 0.0625
surgical = true
constrained_regions = true
