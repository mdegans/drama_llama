# Codecov configuration. Uploaded from the `coverage` job in
# .github/workflows/ci.yml, which runs `scripts/test.py coverage -t all`.
#
# No `ignore:` list here on purpose. `tests/`, `examples/` and `benches/`
# are already excluded upstream, by COVERAGE_IGNORE in scripts/test.py, so
# the lcov that arrives has never contained them. Restating the list here
# would give it two homes and one of them would eventually be wrong.

coverage:
  status:
    # `project` is a REAL gate (2026-07-24, Mike's call): a hard 80%
    # floor, required in branch protection. The coverage job runs on
    # pull_request now precisely so this check can be satisfied — a
    # required status with no upload sits at "Expected" forever and
    # wedges the merge. Headroom is real but thin (82.81% at the time
    # of the flip), and most uncovered mass is model-gated code — if
    # this flaps on a refactor that didn't reduce testing, the answer
    # may be a threshold, not deleted tests.
    project:
      default:
        target: 80%
        informational: false
    # Patch stays informational: new lines in model-gated code can
    # only be covered by the weights-loading tiers, and a hard
    # new-lines gate would punish exactly the code that is hardest to
    # test. The project floor above already catches real erosion.
    patch:
      default:
        informational: true

# PR uploads exist now, so a comment would have data — but the status
# check and the Codecov dashboard already carry it. Off to keep PR
# threads about the diff.
comment: false
